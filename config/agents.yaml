system_agents:
  agents:
  - name: server
    enabled: true
    type: server
    model: gpt-oss:20b
    provider: ollama
    endpoint: http://jcs-macbook-pro:11434
    timeout_seconds: 20
    temperature: 0.3
    top_p: 0.95
    max_tokens: 1024
    context_window: 4096
    command_policy: ops_safe
    allowed_commands:
    - systemctl status hermes
    - journalctl -u hermes -n 50
    - df -h
    - free -h
    approval_required_for_unapproved: true
  
custom_agents:
  agents:
  - name: hermes-chat
    type: chat
    provider: ollama
    endpoint: http://jcs-macbook-pro:11434
    timeout_seconds: 20
    temperature: 0
    model: gpt-oss:120b
    system_prompt: You are Hermes...
    enabled: true
  - name: researcher-daily
    type: researcher
    endpoint: http://jcs-macbook-pro:11434
    provider: ollama
    model: gpt-oss:20b
    tools:
    - Web Search
    - file_write
    timeout_seconds: 20
    output_dir: /home/user/reports
  - name: engineer-1
    type: engineer
    provider: ollama
    model: hermes3
    tools:
    - code_exec
    - git_read
    timeout_seconds: 20
    enabled: true
